<!DOCTYPE html>
<html>
<head>
<title>emine hoca gelcek mi</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(ellipse at center, #1c2340 0%, #05060d 75%);
  font-family: Comic Sans MS, cursive;
  text-align: center;
  color: #e8f0ff;
  overflow-x: hidden;
}

/* the ghost: put her photo next to this file as emine.jpg */
#ghost {
  position: fixed;
  inset: 0;
  background: url('emine.jpg') center 30% / contain no-repeat;
  filter: grayscale(1) brightness(1.7) contrast(0.85) blur(1.5px) drop-shadow(0 0 30px #bfe3ff);
  opacity: 0.45;
  mix-blend-mode: screen;
  -webkit-mask-image: linear-gradient(to bottom, #000 45%, transparent 95%);
          mask-image: linear-gradient(to bottom, #000 45%, transparent 95%);
  animation: float 6s ease-in-out infinite, flicker 4s infinite;
  pointer-events: none;
  z-index: 0;
}
@keyframes float {
  0%, 100% { transform: translateY(0) rotate(-1deg); }
  50%      { transform: translateY(-25px) rotate(1deg); }
}
@keyframes flicker {
  0%, 100% { opacity: 0.45; }
  47%      { opacity: 0.45; }
  50%      { opacity: 0.15; }
  53%      { opacity: 0.5; }
  80%      { opacity: 0.35; }
}
@media (prefers-reduced-motion: reduce) {
  #ghost { animation: none; }
}

.content { position: relative; z-index: 1; padding-top: 30px; }
h1 { font-size: 40px; color: #fff; text-shadow: 0 0 10px #9fd4ff, 0 0 25px #9fd4ff; }
.answer { font-size: 32px; font-weight: bold; color: #fff; border: 3px dashed #9fd4ff; padding: 10px 20px; display: inline-block; margin: 10px; text-shadow: 0 0 8px #9fd4ff; }
button { font-family: Comic Sans MS, cursive; font-size: 18px; padding: 8px 20px; cursor: pointer; margin: 5px; background: #e8f0ff; border: 2px solid #9fd4ff; border-radius: 6px; }
</style>
</head>
<body>
<audio id="song" src="push_me.mp3" loop controls style="position:relative;z-index:1;margin-top:10px;"></audio>

<div id="splash" style="position:fixed;inset:0;background:black;color:#9fd4ff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;cursor:pointer;" onclick="startAudio()">
  <div style="font-size:36px;font-weight:bold;">CLICK TO ENTER</div>
  <div style="font-size:18px;margin-top:10px;">👻 SOUND ON 👻</div>
</div>

<div id="ghost"></div>

<div class="content">
  <h1>emine hoca gelio mu???</h1>
  <div class="answer">hayir</div>
</div>

<script>
const song = document.getElementById('song');
function startAudio() {
  song.play();
  document.getElementById('splash').style.display = 'none';
}
</script>
</body>
</html>
